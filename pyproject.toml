[project]
name = "groupshift-model"
version = "0.1.0"
description = "Model of social processes on bipartite networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "seaborn",
    "tqdm",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
